<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="a1e3a8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker><marker id="ac62828" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker><marker id="ae07b00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker><marker id="a7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a374151" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="1600" height="600" fill="#ffffff"/><text x="60" y="44" font-size="22" font-weight="700" fill="#111827">Compact AST robot: power and safety</text><text x="1540" y="44" text-anchor="end" font-size="13" fill="#6b7280">Nov 2026 · companion to the system architecture diagram · adds sleep / wake</text><rect x="60" y="120" width="170" height="80" rx="10" fill="#fdecec" stroke="#c62828" stroke-width="1.6"/><text x="145.0" y="156.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Wall outlet</text><text x="145.0" y="178.0" text-anchor="middle" font-size="13.5" fill="#4b5563">120 V AC</text><rect x="270" y="120" width="200" height="80" rx="10" fill="#fdecec" stroke="#c62828" stroke-width="1.6"/><text x="370.0" y="147.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">Fused inlet</text><text x="370.0" y="169.0" text-anchor="middle" font-size="13.5" fill="#4b5563">IEC C14 + switch</text><text x="370.0" y="187.0" text-anchor="middle" font-size="13.5" fill="#4b5563">5×20 mm fuse</text><rect x="510" y="108" width="240" height="104" rx="10" fill="#fdecec" stroke="#c62828" stroke-width="1.6"/><text x="630.0" y="138.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2937">24 V supply</text><text x="630.0" y="160.0" text-anchor="middle" font-size="13.5" fill="#4b5563">Mean Well LRS-200-24</text><text x="630.0" y="178.0" text-anchor="middle" font-size="13.5" fill="#4b5563">24 V, 8.8 A</text><text x="630.0" y="196.0" text-anchor="middle" font-size="13.5" fill="#4b5563">input switch on 115 V</text><path d="M230,160 L266,160" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#ac62828)"/><path d="M470,160 L506,160" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#ac62828)"/><path d="M750,160 L772,160" fill="none" stroke="#c62828" stroke-width="2"/><path d="M772,110 L772,330" fill="none" stroke="#c62828" stroke-width="2"/><rect x="800" y="88" width="270" height="46" rx="10" fill="#ffffff" stroke="#c62828" stroke-width="1.6"/><text x="935.0" y="107.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Octopus main power</text><text x="935.0" y="129.0" text-anchor="middle" font-size="13.5" fill="#4b5563">logic + fans, always on</text><path d="M772,111 L796,111" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#ac62828)"/><rect x="800" y="150" width="270" height="78" rx="10" fill="#fdecec" stroke="#c62828" stroke-width="1.6"/><text x="935.0" y="176.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Relay (2-ch 5 V module)</text><text x="935.0" y="198.0" text-anchor="middle" font-size="13.5" fill="#4b5563">COM → NO, 10 A at 30 V DC</text><text x="935.0" y="216.0" text-anchor="middle" font-size="13.5" fill="#4b5563">coil: safety chain · IN: Pi GPIO</text><path d="M772,181 L796,181" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#ac62828)"/><rect x="1120" y="150" width="420" height="62" rx="10" fill="#ffffff" stroke="#c62828" stroke-width="1.6"/><text x="1330.0" y="177.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Switched motor power</text><text x="1330.0" y="199.0" text-anchor="middle" font-size="13.5" fill="#4b5563">Octopus MOTOR_POWER + 3 × CL42T drivers</text><path d="M1070,181 L1116,181" fill="none" stroke="#c62828" stroke-width="2.2" stroke-dasharray="8 5" marker-end="url(#ac62828)"/><rect x="1075.2" y="162" width="35.6" height="18" rx="4" fill="#ffffff"/><text x="1093" y="175" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c62828">24 V</text><rect x="800" y="304" width="270" height="58" rx="10" fill="#fff4e5" stroke="#e07b00" stroke-width="1.6"/><text x="935.0" y="329.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Buck converter</text><text x="935.0" y="351.0" text-anchor="middle" font-size="13.5" fill="#4b5563">24 V → 5 V, 5 A (USB-C)</text><path d="M772,330 L796,330" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#ac62828)"/><rect x="510" y="304" width="240" height="58" rx="10" fill="#ffffff" stroke="#e07b00" stroke-width="1.6"/><text x="630.0" y="329.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Raspberry Pi 5</text><text x="630.0" y="351.0" text-anchor="middle" font-size="13.5" fill="#4b5563">5 V USB-C in · GPIO out</text><path d="M800,346 L754,346" fill="none" stroke="#e07b00" stroke-width="2" marker-end="url(#ae07b00)"/><text x="777" y="366" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e07b00">5 V</text><rect x="1120" y="304" width="200" height="58" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="1220.0" y="329.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">E-stop</text><text x="1220.0" y="351.0" text-anchor="middle" font-size="13.5" fill="#4b5563">latching, NC1 in chain</text><rect x="1360" y="304" width="180" height="58" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="1450.0" y="329.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Door switch</text><text x="1450.0" y="351.0" text-anchor="middle" font-size="13.5" fill="#4b5563">NC, closed = shut</text><path d="M1070,333 L1116,333" fill="none" stroke="#e07b00" stroke-width="2" marker-end="url(#ae07b00)"/><rect x="1078.4" y="314" width="29.200000000000003" height="18" rx="4" fill="#ffffff"/><text x="1093" y="327" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e07b00">5 V</text><path d="M1320,333 L1356,333" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a7c3aed)"/><path d="M1450,304 L1450,246 L990,246 L990,232" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#a7c3aed)"/><rect x="1016.6" y="227" width="406.8" height="18" rx="4" fill="#ffffff"/><text x="1220" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7c3aed">relay coil: powered only while e-stop released AND door closed</text><path d="M700,304 L700,276 L900,276 L900,232" fill="none" stroke="#1e3a8a" stroke-width="2.2" marker-end="url(#a1e3a8a)"/><rect x="798.4" y="268" width="93.2" height="18" rx="4" fill="#ffffff"/><text x="845" y="281" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">GPIO on / off</text><rect x="1120" y="410" width="420" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/><text x="1330.0" y="434.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Octopus input pins</text><text x="1330.0" y="456.0" text-anchor="middle" font-size="13.5" fill="#4b5563">e-stop NC2 + door signal → Klipper stops and reports</text><path d="M1220,362 L1220,406" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a7c3aed)"/><path d="M1450,362 L1450,406" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a7c3aed)"/><rect x="60" y="410" width="1020" height="92" rx="10" fill="#eef2ff" stroke="#1e3a8a" stroke-width="1.4"/><text x="78" y="434" font-size="14" font-weight="700" fill="#1e3a8a">Sleep / wake</text><text x="78" y="456" font-size="13" fill="#374151">Idle for N minutes: the app turns the screen backlight off and switches the relay off (motors unpowered, fan off).</text><text x="78" y="476" font-size="13" fill="#374151">Touch: the screen lights up (first touch ignored), the relay switches on, Klipper restarts to reconfigure the drivers, all axes home.</text><text x="78" y="496" font-size="13" fill="#374151">Motors get power only when the e-stop is released AND the door is closed AND the Pi says on. Software can never override the chain.</text><line x1="60" y1="540" x2="94" y2="540" stroke="#c62828" stroke-width="2.4"/><text x="102" y="544" font-size="13" fill="#374151">24 V</text><line x1="160.8" y1="540" x2="194.8" y2="540" stroke="#c62828" stroke-width="2.4" stroke-dasharray="8 5"/><text x="202.8" y="544" font-size="13" fill="#374151">switched motor 24 V</text><line x1="369.6" y1="540" x2="403.6" y2="540" stroke="#e07b00" stroke-width="2.4"/><text x="411.6" y="544" font-size="13" fill="#374151">5 V</text><line x1="463.20000000000005" y1="540" x2="497.20000000000005" y2="540" stroke="#1e3a8a" stroke-width="2.4"/><text x="505.20000000000005" y="544" font-size="13" fill="#374151">Pi control signal</text><line x1="657.6" y1="540" x2="691.6" y2="540" stroke="#7c3aed" stroke-width="2.4"/><text x="699.6" y="544" font-size="13" fill="#374151">safety chain (relay coil)</text><line x1="909.6" y1="540" x2="943.6" y2="540" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="6 4"/><text x="951.6" y="544" font-size="13" fill="#374151">status signal</text><text x="60" y="574" font-size="12.5" fill="#6b7280">Check that the relay module switches reliably from the Pi’s 3.3 V GPIO (add a small transistor if not) and stays off while the Pi boots. Leave the Octopus VUSB jumper off.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>